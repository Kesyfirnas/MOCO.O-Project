<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Literasi Cafe | Coffee & Books</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">MOCO<span>.O</span></div>
        <ul class="nav-links">
          <li><a href="#">The Cafe</a></li>
          <li><a href="#">Bookstore</a></li>
          <li><a href="#">Community</a></li>
          <li><a href="#" class="btn-cart">Cart (0)</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Sip the Coffee,<br /><span>Flip the page.</span></h1>
        <p>
          Selamat datang di MOCO.O - Ruang di mana aroma kopi bertemu dengan
          imajinasi di setiap halaman buku.
        </p>
        <div class="hero-btns">
          <a href="#" class="btn-primary">Beli Buku</a>
          <a href="#" class="btn-secondary">Lihat Menu Kafe</a>
        </div>
      </section>

      <section class="featured-books">
        <h2>Koleksi Terpilih</h2>
        <div class="book-grid">
          <div class="book-card">
            <img src="buku1.jpg" alt="Cover Buku" />
            <h3>Judul Buku</h3>
            <p>Rp 85.000</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
