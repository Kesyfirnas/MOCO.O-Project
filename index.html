<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Literasi Cafe | Coffee & Books</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">MOCO<span>.O</span></div>
        <ul class="nav-links">
          <li><a href="#">The Cafe</a></li>
          <li><a href="#">Bookstore</a></li>
          <li><a href="#">Community</a></li>
          <li><a href="#" class="btn-cart">Cart (0)</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Sip the Coffee,<br /><span>Flip the page.</span></h1>
        <!-- <img
          src="https://i.pinimg.com/1200x/8a/dc/9e/8adc9ed5ff5345ee5e03af74e2805b83.jpg"
          alt="Coffee and Books"
        /> -->
        <p>
          Selamat datang di MOCO.O - Ruang di mana aroma kopi bertemu dengan
          imajinasi di setiap halaman buku.
        </p>
        <div class="hero-btns">
          <a href="#" class="btn-primary">Jelajahi Buku</a>
          <a href="#" class="btn-secondary">Lihat Menu Kafe</a>
        </div>
      </section>

      <section class="featured-books">
        <h2>Koleksi Terpilih</h2>
        <div class="book-grid">
          <div class="book-card">
            <div class="book-img">
              <img
                src="https://divapress-online.com/Files/cover_buku/1717397499_978-623-6166-83-3.jpg"
                alt="Cover Madilog"
              />
            </div>
            <h3>Madilog</h3>
            <p class="Penulis">Tan Malaka</p>
            <p class="harga-buku">Rp 95.000</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
